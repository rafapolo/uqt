name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - '3d.html'
      - 'js/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install
        run: bun install

      - name: Minify
        run: |
          mkdir -p dist/js dist/assets
          bunx esbuild js/ui.js  --bundle=false --minify --outfile=dist/js/ui.js
          bunx esbuild assets/uqt.css --bundle=false --minify --outfile=dist/assets/uqt.css
          cp index.html dist/
          cp 3d.html dist/
          cp js/uqt-albums.json.gz dist/js/
          cp assets/capa.jpg dist/assets/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
